name: CI

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Smoke check
        run: |
          echo "Running release-readiness smoke check..."
          test -f README.md
          echo "Smoke check passed: README.md is present."
